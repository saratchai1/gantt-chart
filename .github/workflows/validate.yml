name: Validate integrated schedule

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax check
        shell: bash
        run: |
          node --check app.js
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Validate schedule and Thai activity alignment
        run: npm run validate

      - name: Export schedule and review registers
        run: npm run export

      - name: Export Plan 01 Thai activity alignment registers
        run: npm run thai-review

      - name: Upload schedule data
        uses: actions/upload-artifact@v4
        with:
          name: integrated-master-schedule-data
          path: |
            data/master-schedule.csv
            data/master-schedule.json
            data/schedule-stats.json
            data/localization-stats.json
            data/cpm-report.json
            data/validation-report.json
            data/thai-translation-review-register.csv
            data/thai-translation-review-register.json
            data/plan01-thai-activity-alignment-register.csv
            data/plan01-thai-activity-alignment-register.json
            data/thai-work-category-summary.csv
            data/thai-work-category-summary.json
            data/provisional-scope-register.csv
            data/provisional-scope-register.json
            data/provisional-scope-summary.csv
            data/provisional-scope-summary.json
            data/package-document-release-register.csv
            data/system-test-pack-register.csv

      - name: Install PDF dependencies and bilingual Thai/Latin font
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-thai-tlwg fonts-noto-core poppler-utils
          fc-match 'Garuda'
          fc-match 'Garuda:style=Bold'

      - name: Generate Thai A3 master Gantt PDF
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run pdf

      - name: Audit PDF fonts, Thai text and blank pages
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          PDF='data/huai-kha-khaeng-integrated-master-gantt-v0.8-thai.pdf'
          TEXT='data/pdf-text-v08.txt'
          NORMALIZED='data/pdf-text-v08-normalized.txt'
          pdfinfo "$PDF" | tee data/pdf-info-v08.txt
          pdffonts "$PDF" | tee data/pdf-fonts-v08.txt
          pdftotext "$PDF" "$TEXT"
          tr '\n\r\f\t' '    ' < "$TEXT" | tr -s ' ' > "$NORMALIZED"

          pages=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          test -n "$pages"
          test "$pages" -gt 1

          bad=0
          for p in $(seq 1 "$pages"); do
            chars=$(pdftotext -f "$p" -l "$p" "$PDF" - | tr -d '[:space:]' | wc -m)
            printf 'PDF page %s text characters: %s\n' "$p" "$chars"
            if [ "$chars" -lt 40 ]; then
              echo "ERROR: blank or effectively blank PDF page detected: page $p ($chars text chars)"
              bad=1
            fi
          done
          test "$bad" -eq 0

          grep -Eiq 'Garuda' data/pdf-fonts-v08.txt
          for phrase in \
            'แผนงานก่อสร้างห้วยขาแข้ง' \
            'งานปรับบริเวณ' \
            'งานโครงสร้าง' \
            'สถาปัตย์' \
            'งานระบบไฟฟ้าและสื่อสาร'
          do
            echo "Checking extracted PDF text: $phrase"
            grep -Fq "$phrase" "$NORMALIZED"
          done

          pdftoppm -png -f 1 -singlefile -r 120 "$PDF" data/pdf-v08-preview-page-01 >/dev/null 2>&1
          pdftoppm -png -f 2 -singlefile -r 120 "$PDF" data/pdf-v08-preview-page-02 >/dev/null 2>&1

      - name: Upload Thai PDF artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: integrated-master-schedule-pdf-v08-thai
          path: |
            data/huai-kha-khaeng-integrated-master-gantt-v0.8-thai.pdf
            data/pdf-info-v08.txt
            data/pdf-fonts-v08.txt
            data/pdf-text-v08.txt
            data/pdf-text-v08-normalized.txt
            data/pdf-v08-preview-page-01.png
            data/pdf-v08-preview-page-02.png

      - name: Publish Thai PDF snapshot branch
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B pdf-export-v08
          git add -f \
            data/huai-kha-khaeng-integrated-master-gantt-v0.8-thai.pdf \
            data/pdf-v08-preview-page-01.png \
            data/pdf-v08-preview-page-02.png
          git commit -m 'Publish Thai Baseline v0.8 Gantt PDF preview [skip ci]'
          git push origin HEAD:pdf-export-v08 --force
