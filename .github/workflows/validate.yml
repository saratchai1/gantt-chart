name: Validate integrated schedule

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Source syntax check
        shell: bash
        run: |
          node --check app.js
          node --check team-app.js
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          python3 -m py_compile \
            scripts/audit-pdf-render-v08.py \
            scripts/audit-pdf-render-v081.py \
            scripts/audit-pdf-render-v082.py \
            scripts/audit-team-pdf-render-220869.py \
            scripts/audit-team-pdf-render-220869-v091.py

      - name: Validate integrated detailed schedule
        run: npm run validate

      - name: Validate detailed web zone hierarchy
        run: npm run web:validate

      - name: Validate corrected Excel 220869 team Gantt
        run: npm run team:validate

      - name: Export integrated schedule and review registers
        run: npm run export

      - name: Export corrected Excel 220869 team Gantt and confirmation registers
        run: npm run team:export

      - name: Export Plan 01 Thai activity alignment registers
        run: npm run thai-review

      - name: Upload schedule, source-driven Gantt and validation data
        uses: actions/upload-artifact@v4
        with:
          name: integrated-and-team-gantt-data-v091
          path: |
            data/master-schedule.csv
            data/master-schedule.json
            data/schedule-stats.json
            data/localization-stats.json
            data/cpm-report.json
            data/validation-report.json
            data/web-hierarchy-validation.json
            data/team-gantt-220869.csv
            data/team-gantt-220869.json
            data/team-gantt-220869-v091.csv
            data/team-gantt-220869-v091.json
            data/team-source-register-220869.json
            data/team-gantt-mapping-register-220869.csv
            data/team-gantt-mapping-register-220869-v091.csv
            data/team-gantt-timing-confirmation-register-220869-v091.csv
            data/team-gantt-validation-220869.json
            data/team-gantt-validation-220869-v091.json
            data/thai-translation-review-register.csv
            data/thai-translation-review-register.json
            data/plan01-thai-activity-alignment-register.csv
            data/plan01-thai-activity-alignment-register.json
            data/thai-work-category-summary.csv
            data/thai-work-category-summary.json
            data/provisional-scope-register.csv
            data/provisional-scope-register.json
            data/provisional-scope-summary.csv
            data/provisional-scope-summary.json
            data/package-document-release-register.csv
            data/system-test-pack-register.csv

      - name: Install PDF, font and raster-audit dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/detailed-') || startsWith(github.head_ref, 'pdf/team-') }}
        shell: bash
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-thai-tlwg fonts-noto-core poppler-utils python3-pil
          fc-match 'Garuda'
          fc-match 'Garuda:style=Bold'

      # Detailed 1,066-activity PDF remains a separate opt-in issue.
      - name: Generate Thai A3 detailed master Gantt PDF
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/detailed-') }}
        run: npm run pdf

      - name: Extract and render v0.8.2 detailed PDF for QA
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/detailed-') }}
        shell: bash
        run: |
          set -euo pipefail
          PDF='data/huai-kha-khaeng-integrated-master-gantt-v0.8.2-thai.pdf'
          TEXT='data/pdf-text-v082.txt'
          NORMALIZED='data/pdf-text-v082-normalized.txt'
          TSV='data/pdf-tsv-v082.tsv'
          pdfinfo "$PDF" | tee data/pdf-info-v082.txt
          pdffonts "$PDF" | tee data/pdf-fonts-v082.txt
          pdftotext "$PDF" "$TEXT"
          pdftotext -tsv "$PDF" "$TSV"
          tr '\n\r\f\t' '    ' < "$TEXT" | tr -s ' ' > "$NORMALIZED"
          grep -q '(A3)' data/pdf-info-v082.txt
          pages=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          test -n "$pages"
          test "$pages" -gt 1
          bad=0
          for page in $(seq 1 "$pages"); do
            chars=$(pdftotext -f "$page" -l "$page" "$PDF" - | tr -d '[:space:]' | wc -m)
            if [ "$chars" -lt 40 ]; then
              echo "ERROR: blank detailed PDF page $page ($chars chars)"
              bad=1
            fi
          done
          test "$bad" -eq 0
          grep -Eiq 'Garuda.*yes.*yes.*yes' data/pdf-fonts-v082.txt
          text_chars=$(tr -d '[:space:]' < "$TEXT" | wc -m)
          test "$text_chars" -gt 170000
          rm -rf data/pdf-v082-pages
          mkdir -p data/pdf-v082-pages
          pdftoppm -png -r 72 "$PDF" data/pdf-v082-pages/page >/dev/null 2>&1
          pdftoppm -png -f 1 -singlefile -r 120 "$PDF" data/pdf-v082-preview-page-01 >/dev/null 2>&1
          pdftoppm -png -f 2 -singlefile -r 120 "$PDF" data/pdf-v082-preview-page-02 >/dev/null 2>&1
          pdftoppm -png -f 10 -singlefile -r 120 "$PDF" data/pdf-v082-preview-page-10 >/dev/null 2>&1
          pdftoppm -png -f "$pages" -singlefile -r 120 "$PDF" data/pdf-v082-preview-page-final >/dev/null 2>&1

      - name: Deep-audit detailed PDF
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/detailed-') }}
        run: npm run pdf:audit

      - name: Raster-audit detailed PDF
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/detailed-') }}
        run: python3 scripts/audit-pdf-render-v082.py

      - name: Upload detailed PDF artifact
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/detailed-') }}
        uses: actions/upload-artifact@v4
        with:
          name: integrated-master-schedule-pdf-v082-thai
          path: |
            data/huai-kha-khaeng-integrated-master-gantt-v0.8.2-thai.pdf
            data/pdf-info-v082.txt
            data/pdf-fonts-v082.txt
            data/pdf-generation-report-v082.json
            data/pdf-deep-audit-v082.json
            data/pdf-render-audit-v082.json
            data/pdf-v082-preview-page-*.png
            data/pdf-v082-contact-sheet-*.png

      - name: Publish reviewed detailed PDF snapshot branch
        if: ${{ startsWith(github.head_ref, 'pdf/detailed-') }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B pdf-export-v082
          git add -f \
            data/huai-kha-khaeng-integrated-master-gantt-v0.8.2-thai.pdf \
            data/pdf-v082-preview-page-*.png \
            data/pdf-v082-contact-sheet-*.png \
            data/pdf-generation-report-v082.json \
            data/pdf-deep-audit-v082.json \
            data/pdf-render-audit-v082.json
          git commit -m 'Publish reviewed Thai v0.8.2 detailed Gantt PDF [skip ci]'
          git push origin HEAD:pdf-export-v082 --force

      # Excel 220869 source-driven v0.9.1 PDF is the primary team issue.
      - name: Generate corrected Excel 220869 Team Gantt PDF v0.9.1
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/team-') }}
        run: npm run team:pdf

      - name: Extract and render Excel 220869 Team Gantt PDF v0.9.1 for QA
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/team-') }}
        shell: bash
        run: |
          set -euo pipefail
          PDF='data/huai-kha-khaeng-team-gantt-220869-v0.9.1-thai.pdf'
          TEXT='data/team-pdf-text-220869-v091.txt'
          NORMALIZED='data/team-pdf-text-220869-v091-normalized.txt'
          TSV='data/team-pdf-tsv-220869-v091.tsv'
          pdfinfo "$PDF" | tee data/team-pdf-info-220869-v091.txt
          pdffonts "$PDF" | tee data/team-pdf-fonts-220869-v091.txt
          pdftotext "$PDF" "$TEXT"
          pdftotext -tsv "$PDF" "$TSV"
          tr '\n\r\f\t' '    ' < "$TEXT" | tr -s ' ' > "$NORMALIZED"
          grep -q '(A3)' data/team-pdf-info-220869-v091.txt
          pages=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          test -n "$pages"
          test "$pages" -gt 1
          bad=0
          for page in $(seq 1 "$pages"); do
            chars=$(pdftotext -f "$page" -l "$page" "$PDF" - | tr -d '[:space:]' | wc -m)
            printf 'Team PDF v0.9.1 page %s text characters: %s\n' "$page" "$chars"
            if [ "$chars" -lt 40 ]; then
              echo "ERROR: blank or effectively blank Team PDF page $page ($chars chars)"
              bad=1
            fi
          done
          test "$bad" -eq 0
          grep -Eiq 'Garuda.*yes.*yes.*yes' data/team-pdf-fonts-220869-v091.txt
          grep -Fq 'ฉบับแก้ไข v0.9.1' "$NORMALIZED"
          grep -Fq 'ช่วงเวลาครอบคลุม' "$NORMALIZED"
          grep -Fq 'TBC — รอยืนยัน' "$NORMALIZED"
          grep -Fq 'ไม่ใช่ Cash Flow หรือ Payment Schedule' "$NORMALIZED"
          grep -Fq 'fef660d14ae8ddecda66af3980cee939ac72c84d' "$NORMALIZED"
          grep -Fq '1405af254e0ffb590455de45170cbcf25d38790c' "$NORMALIZED"
          grep -Fq 'โซน Drop-off' "$NORMALIZED"
          if grep -Fq 'โซนพื้นที่ศึกษาธรรมชาติ (zone D)rop-off' "$NORMALIZED"; then
            echo 'ERROR: malformed Excel source text remains visible in team issue PDF'
            exit 1
          fi
          text_chars=$(tr -d '[:space:]' < "$TEXT" | wc -m)
          test "$text_chars" -gt 18000
          rm -rf data/team-pdf-pages-220869-v091
          mkdir -p data/team-pdf-pages-220869-v091
          pdftoppm -png -r 72 "$PDF" data/team-pdf-pages-220869-v091/page >/dev/null 2>&1
          pdftoppm -png -f 1 -singlefile -r 120 "$PDF" data/team-pdf-preview-page-01-v091 >/dev/null 2>&1
          pdftoppm -png -f 2 -singlefile -r 120 "$PDF" data/team-pdf-preview-page-02-v091 >/dev/null 2>&1
          sample_page=$(( pages > 4 ? 4 : pages ))
          pdftoppm -png -f "$sample_page" -singlefile -r 120 "$PDF" data/team-pdf-preview-page-sample-v091 >/dev/null 2>&1
          pdftoppm -png -f "$pages" -singlefile -r 120 "$PDF" data/team-pdf-preview-page-final-v091 >/dev/null 2>&1

      - name: Deep-audit Excel 220869 Team Gantt PDF v0.9.1
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/team-') }}
        run: npm run team:pdf:audit

      - name: Raster and semantic-color audit Excel 220869 Team Gantt PDF v0.9.1
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/team-') }}
        run: python3 scripts/audit-team-pdf-render-220869-v091.py

      - name: Upload Excel 220869 Team Gantt PDF v0.9.1 and QA artifact
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'pdf/team-') }}
        uses: actions/upload-artifact@v4
        with:
          name: team-gantt-220869-pdf-v091-thai
          path: |
            data/huai-kha-khaeng-team-gantt-220869-v0.9.1-thai.pdf
            data/team-pdf-info-220869-v091.txt
            data/team-pdf-fonts-220869-v091.txt
            data/team-pdf-text-220869-v091.txt
            data/team-pdf-text-220869-v091-normalized.txt
            data/team-pdf-tsv-220869-v091.tsv
            data/team-pdf-generation-report-220869-v091.json
            data/team-pdf-deep-audit-220869-v091.json
            data/team-pdf-deep-audit-220869-v091.md
            data/team-pdf-render-audit-220869-v091.json
            data/team-pdf-render-audit-220869-v091.md
            data/team-pdf-preview-page-*-v091.png
            data/team-pdf-contact-sheet-220869-v091-*.png
            data/team-gantt-timing-confirmation-register-220869-v091.csv
            data/team-gantt-mapping-register-220869-v091.csv

      - name: Publish reviewed Excel 220869 Team Gantt PDF v0.9.1 snapshot branch
        if: ${{ startsWith(github.head_ref, 'pdf/team-') }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B pdf-export-team-220869-v091
          git add -f \
            data/huai-kha-khaeng-team-gantt-220869-v0.9.1-thai.pdf \
            data/team-pdf-preview-page-*-v091.png \
            data/team-pdf-contact-sheet-220869-v091-*.png \
            data/team-pdf-generation-report-220869-v091.json \
            data/team-pdf-deep-audit-220869-v091.json \
            data/team-pdf-render-audit-220869-v091.json \
            data/team-gantt-timing-confirmation-register-220869-v091.csv \
            data/team-gantt-mapping-register-220869-v091.csv
          git commit -m 'Publish reviewed Excel 220869 Team Gantt v0.9.1 PDF [skip ci]'
          git push origin HEAD:pdf-export-team-220869-v091 --force
