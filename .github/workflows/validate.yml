name: Validate integrated schedule

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF dependencies and Thai font
        shell: bash
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
      - name: JavaScript syntax check
        shell: bash
        run: |
          node --check app.js
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Validate schedule
        run: npm run validate
      - name: Export schedule artifacts
        run: npm run export
      - name: Generate A3 master Gantt PDF
        run: npm run pdf
      - name: Upload generated schedule
        uses: actions/upload-artifact@v4
        with:
          name: integrated-master-schedule
          path: |
            data/master-schedule.csv
            data/master-schedule.json
            data/schedule-stats.json
            data/cpm-report.json
            data/validation-report.json
            data/provisional-scope-register.csv
            data/provisional-scope-register.json
            data/provisional-scope-summary.csv
            data/provisional-scope-summary.json
            data/package-document-release-register.csv
            data/system-test-pack-register.csv
            data/huai-kha-khaeng-integrated-master-gantt-v0.7.pdf
      - name: Publish generated PDF snapshot
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B pdf-export
          git add -f data/huai-kha-khaeng-integrated-master-gantt-v0.7.pdf
          git commit -m 'Publish generated A3 Gantt PDF [skip ci]'
          git push origin HEAD:pdf-export --force
      - name: Publish generated PDF to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/huai-kha-khaeng-integrated-master-gantt-v0.7.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Update generated A3 Gantt PDF [skip ci]'
            git push
          fi
